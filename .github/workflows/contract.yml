name: Contract tests

on:
  # Fired by lightning / kit CI on merge or release.
  repository_dispatch:
    types: [lightning-updated, worker-updated]
  # Manual runs with hand-picked tags for debugging a specific pairing.
  workflow_dispatch:
    inputs:
      lightning_tag:
        description: openfn/lightning image tag
        default: latest
      worker_tag:
        description: openfn/ws-worker image tag
        default: latest

jobs:
  contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Test the dispatched build against both refs of the other side.
        include:
          - lightning: main
            worker: latest
          - lightning: latest
            worker: main
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Generate test secrets
        run: ./bin/gen-secrets.sh

      - name: Resolve image tags
        run: |
          echo "LIGHTNING_TAG=${{ github.event.client_payload.lightning_tag || matrix.lightning }}" >> "$GITHUB_ENV"
          echo "WORKER_TAG=${{ github.event.client_payload.worker_tag || matrix.worker }}" >> "$GITHUB_ENV"

      - run: npm ci

      - name: Run contract tests
        env:
          KEEP_STACK: '1' # keep the stack so we can grab logs on failure
        run: npm test

      - name: Collect compose logs
        if: always()
        run: docker compose logs --no-color > compose-logs.txt || true

      - name: Upload compose logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs-l-${{ matrix.lightning }}-w-${{ matrix.worker }}
          path: compose-logs.txt

      - name: Tear down
        if: always()
        run: docker compose down -v || true
