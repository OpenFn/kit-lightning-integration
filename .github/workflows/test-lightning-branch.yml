name: Test against a Lightning branch

on:
  workflow_dispatch:
    inputs:
      lightning_ref:
        description: "Lightning branch, tag, or full SHA to test"
        required: true
        default: main
      lightning_repo:
        description: "Lightning repo (owner/name) — change for a fork"
        required: false
        default: OpenFn/lightning
      worker:
        description: "Worker spec: npm version (latest, 1.14.1), kit ref, or owner/repo#ref"
        required: false
        default: latest

jobs:
  contract:
    runs-on: ubuntu-latest
    env:
      LIGHTNING: "${{ inputs.lightning_repo || 'OpenFn/lightning' }}#${{ inputs.lightning_ref }}"
      WORKER: ${{ inputs.worker || 'latest' }}
      KEEP_STACK: "1" # leave the stack up so we can grab logs on failure

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      # Match Lightning's .tool-versions.
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.3"
          otp-version: "27.3.3"

      # Node runs Lightning's assets install and the worker under test;
      # bun runs the harness itself.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@v2

      # For worker-from-kit-checkout specs; harmless otherwise.
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - run: bun install

      # Boots Lightning natively (clones $LIGHTNING, mix deps.get,
      # mix phx.server, waits for health) and runs the suite against it.
      - name: Run contract tests (Lightning built from source)
        run: bun run test

      - name: Upload stack logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stack-logs-${{ inputs.lightning_ref }}
          path: |
            tmp/lightning.log
            tmp/worker.log
          if-no-files-found: ignore

      - name: Stop Lightning
        if: always()
        run: bun run stack down || true
