name: Test against a Lightning branch

on:
  workflow_dispatch:
    inputs:
      lightning_ref:
        description: "Lightning branch, tag, or SHA to test"
        required: true
        default: main
      lightning_repo:
        description: "Lightning repo (owner/name) — change for a fork"
        required: false
        default: OpenFn/lightning
      worker_tag:
        description: "openfn/ws-worker image tag to test against"
        required: false
        default: latest

jobs:
  contract:
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.lightning-src.yml
      LIGHTNING_SRC: ./lightning
      WORKER_TAG: ${{ inputs.worker_tag || 'latest' }}
      HARNESS_BUILD: "1"
      KEEP_STACK: "1"
    steps:
      - name: Checkout harness
        uses: actions/checkout@v4

      - name: Checkout Lightning @ ${{ inputs.lightning_ref }}
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.lightning_repo || 'OpenFn/lightning' }}
          ref: ${{ inputs.lightning_ref }}
          path: lightning
          # For a PRIVATE Lightning repo, add a token with repo scope:
          # token: ${{ secrets.LIGHTNING_CHECKOUT_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Generate test secrets
        run: ./bin/gen-secrets.sh

      - run: npm ci

      - name: Run contract tests (Lightning built from source)
        run: npm test

      - name: Collect compose logs
        if: always()
        run: docker compose logs --no-color > compose-logs.txt || true

      - name: Upload compose logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs-${{ inputs.lightning_ref }}
          path: compose-logs.txt

      - name: Tear down
        if: always()
        run: docker compose down -v || true
