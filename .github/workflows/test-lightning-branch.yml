name: Test against a Lightning branch

# Boots a real Lightning (built from the chosen ref) and a real ws-worker on
# the runner, then runs the contract suite against the pair.
#
# The toolchain is *not* pinned here: Erlang/Elixir/node come from the
# checkout's own .tool-versions, so a Lightning bump can't silently break this.

on:
  workflow_dispatch:
    inputs:
      lightning_ref:
        description: "Lightning branch, tag, or SHA to test"
        required: true
        default: main
      lightning_repo:
        description: "Lightning repo (owner/name) — change for a fork"
        required: false
        default: OpenFn/lightning
      worker:
        description: "Worker spec: npm version (latest, 1.14.1), kit ref, or owner/repo#ref"
        required: false
        default: latest

concurrency:
  group: contract-${{ inputs.lightning_repo }}-${{ inputs.lightning_ref }}-${{ inputs.worker }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # The harness always takes a local checkout path — the "Checkout Lightning"
      # step below has already fetched the chosen ref there.
      LIGHTNING: ${{ github.workspace }}/.cache/lightning
      WORKER: ${{ inputs.worker || 'latest' }}
      KEEP_STACK: "1" # leave the stack up so logs are intact for the upload step

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - name: Checkout Lightning @ ${{ inputs.lightning_ref }}
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.lightning_repo || 'OpenFn/lightning' }}
          ref: ${{ inputs.lightning_ref }}
          path: .cache/lightning

      # Erlang/Elixir exactly as the checkout pins them (setup-beam requires
      # `strict` when reading from a file).
      - uses: erlef/setup-beam@v1
        with:
          version-file: .cache/lightning/.tool-versions
          version-type: strict

      # Node runs Lightning's assets and the worker under test — again from
      # the checkout's pin. bun runs the harness itself.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .cache/lightning/.tool-versions

      - uses: oven-sh/setup-bun@v2

      # For worker-from-kit-checkout specs; harmless otherwise.
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      # Lightning's `enacl` builds from source and links libsodium.
      - name: Install system deps
        run: sudo apt-get update -q && sudo apt-get install -y -q libsodium-dev

      - run: bun install

      # Prepares the checkout (deps, assets, runtime, db), boots Lightning +
      # worker, runs the suite. No caching yet, so this recompiles Lightning
      # from scratch on every run.
      - name: Run contract tests
        run: bun run test

      - name: Upload stack logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stack-logs
          path: |
            tmp/lightning.log
            tmp/worker.log
            tmp/prep.log
          if-no-files-found: ignore

      - name: Stop the stack
        if: always()
        run: bun run down || true
